# Rubix default configuration.
# Copy to $XDG_CONFIG_HOME/rubix/config.toml (or ~/.config/rubix/config.toml) to override.

# Commands run once, via `sh -c`, after the compositor is up (Wayland socket
# published + XWayland ready). The Rubix equivalent of AwesomeWM's autorun.
# Here: import the compositor env into the systemd --user environment and start
# the Rubix session target, which pulls in the notification daemon (mako),
# clipboard (copyq), polkit agent, wallpaper (swaybg), and teams-for-notif.
startup = [
    "systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start rubix-session.target",
]

# SDR white luminance (nits) fed to the HDR encode shader for `hdr = true`
# outputs -- the "brightness slider" for SDR content composited through the
# HDR (BT.2020/PQ) pipeline. Live/hot-reloadable: editing and saving this
# value takes effect immediately, no restart. Also adjustable at runtime via
# Alt+XF86AudioRaiseVolume / Alt+XF86AudioLowerVolume (Super+ on a real TTY
# session -- see keybinds below). Valid range [80, 300]; out-of-range values
# are clamped. Omitting the key defaults to 203 (BT.2408 reference SDR white).
sdr_white_nits = 203.0

[layout]
# Number of columns instantiated on the monitor at startup.
# Mirrors Monitor::visible_columns -- config keys match the Rust identifiers exactly.
visible_columns = 3

# Gap, in pixels, between each column and the monitor edge / its neighbours.
# Monitor edges and inter-column seams both measure exactly outer_gap (the seam is
# split half-and-half between adjacent columns). Omitting the key defaults to 20.
outer_gap = 20

# Gap, in pixels, between tiled windows *within* a group's split tree. Exactly one
# inner_gap sits in each split seam. Omitting the key defaults to 10.
inner_gap = 10

# Per-connector output placement. Omitting this section (or omitting an entry
# for a given connector) is fine -- unconfigured outputs are auto-laid-out
# left-to-right so they never collide at the same origin. Uncomment and adjust
# to pin a specific connector's position (and optionally its mode).
# [[output]]
# name = "DP-3"            # connector name, as reported by the DRM backend
# position = [0, 0]        # top-left corner in global compositor space
# mode = "1920x1080"       # optional; omit to use the output's preferred mode
# primary = true           # optional, defaults to false
# hdr = true   # opt-in HDR (BT.2020/PQ) for this output; default false. Requires an HDR display.
#
# [[output]]
# name = "HDMI-A-1"
# position = [1920, 0]
# mode = "1280x400"
# transform = "270"  # normal|90|180|270|flipped|flipped-90|...|left|right; rotates the output

[animation]
# Duration of scroll/rotate slide tweens, in milliseconds. Omitting this
# section entirely is fine -- it defaults to 250.
duration_ms = 250

# Keybinds map a chord to a NavAction variant. The value is the *exact* Rust
# variant name -- serde deserializes it straight into the enum, so there is no
# translation table in code. Chord syntax: modifier tokens (Super/Alt/Ctrl/Shift,
# case-insensitive) joined with '+', ending in an xkb keysym name ("Return", "h").
# Alt-based defaults so the binds survive nested testing under a host WM that
# grabs Super; switch to Super for a real TTY session.
[keybinds]
"Alt+h" = "RotateColumnsLeft"
"Alt+l" = "RotateColumnsRight"
"Alt+j" = "ScrollColumnDown"
"Alt+k" = "ScrollColumnUp"
"Alt+Return" = "MoveToNewColumn"
"Alt+Shift+H" = "MoveActiveColumnLeft"
"Alt+Shift+L" = "MoveActiveColumnRight"
# Relocate the focused window across the group grid: h/l cross columns (landing in
# the destination column's active row), j/k walk rows within the column. j=Down /
# k=Up to match the ScrollColumn binds above.
"Alt+Control+h" = "MoveFocusedWindowLeft"
"Alt+Control+l" = "MoveFocusedWindowRight"
"Alt+Control+j" = "MoveFocusedWindowDown"
"Alt+Control+k" = "MoveFocusedWindowUp"
# Zoom the cube: more visible columns (narrower bands) / fewer (wider bands).
"Alt+Shift+J" = "IncrementVisibleColumns"
"Alt+Shift+K" = "DecrementVisibleColumns"
"Alt+n" = "NewGroup"
# Flip the focused window's parent split between horizontal and vertical.
"Alt+r" = "FlipSplitDirection"
"Alt+Shift+space" = { Spawn = "alacritty" }
# Launcher. rofi picks its wayland (layer-shell) backend automatically under
# Rubix; the compositor grants it keyboard focus via layer-shell keyboard
# interactivity (see focus_interactive_layer).
"Super+space" = { Spawn = "rofi -show drun" }
# Audio. Bare XF86 media keysyms (resolved case-sensitively by xkb) reach the
# compositor via libinput on the TTY; each Spawns a pactl command against the
# default sink/source. The waybar volume module reacts on its own via `pactl
# subscribe`, so no compositor-side sink handler is needed. pactl matches the
# bar's tooling (@DEFAULT_SINK@).
"XF86AudioRaiseVolume" = { Spawn = "pactl set-sink-volume @DEFAULT_SINK@ +5%" }
"XF86AudioLowerVolume" = { Spawn = "pactl set-sink-volume @DEFAULT_SINK@ -5%" }
"XF86AudioMute" = { Spawn = "pactl set-sink-mute @DEFAULT_SINK@ toggle" }
"XF86AudioMicMute" = { Spawn = "pactl set-source-mute @DEFAULT_SOURCE@ toggle" }
# SDR-white-nits "brightness slider" for HDR outputs (see sdr_white_nits
# above). Alt-based to match this file's nested-testing convention; switch to
# Super for a real TTY session (matches "Super+space" launcher above).
"Alt+XF86AudioRaiseVolume" = "IncreaseSdrWhite"
"Alt+XF86AudioLowerVolume" = "DecreaseSdrWhite"
# Live A/B toggle: flips HDR on/off on every HDR-capable output with no
# restart. Shifted-letter final token (matches Alt+Shift+H/+L/+J/+K above --
# the key event's keysym is already the shifted symbol when Shift is held).
"Alt+Shift+T" = "ToggleHdr"
# Exit the compositor. On the TTY backend this is the only in-session quit (winit
# also closes on the host window's close button). Ctrl+Alt+Fn switches VTs.
# Uppercase Q: with Shift held, xkb resolves the key to its shifted symbol, so the
# chord's final token must be the shifted form (matching Alt+Shift+H / +L above).
"Alt+Shift+Q" = "Quit"
