# Window decoration, animation, and wallpaper.
#
# Every *.toml under this directory is loaded and merged, so the split
# across files is organisational only -- move things wherever suits you.

# Optional section: omitting [wallpaper] entirely draws no wallpaper, and each
# output clears to black -- which is what every config predating this section
# did. Live/hot-reloadable, and settable at runtime over IPC without touching
# this file:
#   printf '{"type":"set_wallpaper","path":"/path/img.avif","output":null}\n' | \
#     socat - UNIX-CONNECT:"$XDG_RUNTIME_DIR/rubix.sock"
# (an IPC change is not written back here, so a reload restores this file).
[wallpaper]
# Path to an image, or to a directory of them. `~` expands to $HOME.
# Formats: .avif, .png, .jpg.
#
# A directory becomes a slideshow: every readable image in it, in sorted order,
# each shown for `interval_seconds`. Files that will not decode are logged and
# dropped from the rotation rather than stalling it. Only the current image and
# the next one are held in memory, and the next is decoded on a worker thread
# ahead of time -- a 2.5K AVIF costs over 100ms, which would be a visible hitch
# if it happened on the compositor thread at swap time.
#
# AVIF is the one to use for HDR. It carries a CICP block naming its transfer
# function, so an image graded to ST 2084 (PQ) is detected as HDR at load and
# decoded through the PQ inverse EOTF -- the same shader an HDR client buffer
# takes. PNG and JPEG are always treated as sRGB.
#
# An HDR wallpaper works on an SDR output too: it is tone-mapped down per
# frame, so a mixed monitor set (one HDR panel, one not) shows the same image
# correctly on both. It also drives an HDR-capable connector into HDR mode on
# its own, with no HDR window needed.
#
# Grade to roughly your panel's peak. An image mastered at 4000 nits on a
# 600-nit display spends most of its range in the tone-map's soft knee and
# looks flatter than the same image graded to 600.
# path = "~/wallpapers/default.avif"

# How the image maps onto an output it does not match in aspect ratio:
#   Fill     scale to cover, cropping the overflowing axis (default)
#   Fit      scale to fit inside, leaving black bars on the shorter axis
#   Stretch  scale both axes independently, ignoring aspect ratio
#   Center   no scaling; centred, and cropped if larger than the output
mode = "Fill"

# Overall wallpaper brightness on an HDR monitor.
# Turn it UP for a brighter wallpaper, DOWN for a dimmer one.
# Mostly useful for taming SDR-to-HDR converted images, which tend to come
# out far too bright. Range [0.05, 4.0], clamped.
# Changing it re-decodes the image, so it applies on save.
# Details: docs/brightness-tuning.md
luminance_scale = 1.0

# Wallpaper brightness on a NON-HDR monitor (and in screenshots).
# BACKWARDS from what you would expect: turn it UP to make the wallpaper
# DARKER, DOWN to make it brighter. It is a reference white, not a
# brightness -- saying "3000 nits counts as white" makes everything dimmer.
# Does nothing on an HDR monitor. Takes effect on save.
# Details: docs/brightness-tuning.md
sdr_reference_nits = 203.0

# Seconds each image is shown when `path` is a directory. Ignored for a single
# file. Minimum 1. Omitting it defaults to 300 (five minutes).
interval_seconds = 300

[animation]
# Duration of scroll/rotate slide tweens, in milliseconds. Omitting this
# section entirely is fine -- it defaults to 250.
duration_ms = 250

# Window borders. Drawn OUTSIDE the client rect, over the surrounding gap, so a
# window's tile keeps its full size -- the trade is that borders eat into
# `inner_gap`/`outer_gap`. At `inner_gap = 0` adjacent borders overlap; at
# `outer_gap = 0` the outermost ring clips at the screen edge. Raise the gaps to
# give borders room.
#
# Fullscreen windows never get a border: an element stacked above a fullscreen
# window disqualifies it from direct primary-plane scanout, which is the path
# HDR gaming depends on.
[decoration]
# Logical pixels. 0 disables borders entirely and skips all decoration work.
border_width = 2

# Corner radius in logical pixels. 0 (the default) disables rounding entirely
# and keeps the batched render path the compositor used before rounding
# existed, so nobody pays for a feature they have not asked for.
#
# Rounding clips each window with a signed-distance mask in the fragment
# shader. Two consequences worth knowing:
#   - A rounded window is no longer opaque, so it stops contributing to
#     occlusion culling. Expect slightly more work per frame on a busy screen.
#   - Fullscreen windows are never rounded. There is no gap for a corner to
#     reveal, and rounding would cost the direct scanout that HDR gaming needs.
#
# The border follows this same radius, staying concentric with the window edge.
# corner_radius = 8

# Colors accept #RGB, #RRGGBB, or #RRGGBBAA (the leading '#' is optional). An
# alpha of 0 skips the border for that window without disabling the feature.
# Defaults are Catppuccin Mocha blue / surface1.
active_color = "#89b4fa"
inactive_color = "#45475a"

# How brightly the focused window's border glows on an HDR monitor.
# Turn it UP for a more eye-catching focus ring, DOWN for a subtler one.
# Set above sdr_white_nits to get a focus indicator that SDR chrome
# physically cannot express. Omit or set 0 for no opinion.
# Ignored on non-HDR monitors, in screenshots, and in screencasts.
# Details: docs/brightness-tuning.md
# Commented out so this file matches the built-in defaults exactly: a config
# omitting [decoration] entirely gets no luminance opinion. Uncomment to opt in.
# # active_luminance_nits = 350.0
# inactive_luminance_nits = 0

# Glow: how far the border's light spills past the ring, in logical pixels.
# 0 (the default) draws a plain ring and nothing else. The glow is drawn from
# the same rounded-rect distance field as the ring, so it stays concentric with
# the corner curve instead of pooling at the corners.
#
# This is where HDR earns its keep. In SDR a glow has to brighten toward white
# to be visible at all, which washes out the hue and competes with window
# content -- which is why glows tend to look gaudy. With a luminance above SDR
# white the glow keeps its saturation and simply sits brighter than the desktop,
# reading as light spilling off the window edge. Subtlety comes from the
# headroom, not from turning the opacity down.
#
# Keep the margin inside your gaps, or neighbouring windows will sit in each
# other's glow.
# active_glow_margin = 12
# inactive_glow_margin = 0

# Shapes how quickly the glow gives out: 1.0 is linear, higher keeps it tight
# to the border, lower spreads it across the gap. Applies to both states, and
# can be overridden per rule.
# glow_falloff = 2.0

# Window opacity, 0.0-1.0. 1.0 (the default) leaves windows untouched and keeps
# every optimization an opaque window gets -- below 1.0 a window stops
# contributing to occlusion culling, so things behind it must be drawn.
#
# Fullscreen windows are always forced opaque regardless of any rule: a
# translucent window cannot take direct primary-plane scanout, which is the path
# a fullscreen window exists to get.
#
# Note this composites in the linear working space on an HDR output, so
# translucency blends in light rather than in gamma-encoded values -- which is
# more correct than most compositors manage, and looks it.
# active_opacity = 1.0
# inactive_opacity = 0.92

# Opacity for a window that is covered by other windows. 1.0 (the default)
# switches the whole occlusion check off, including its per-frame geometry.
#
# This exists because of translucency, not in spite of it. Promote a window over
# its neighbours and, at anything under full opacity, those neighbours bleed
# through it and the result is muddy. Fading what is underneath means what shows
# through a promoted window is mostly wallpaper instead of a pile of other
# windows.
#
# Windows above count as occluders whatever their own opacity: if the window on
# top were opaque, the one below would already be culled and none of this would
# matter.
#
# Fading only ever goes one way -- a window a rule already made more transparent
# stays that way, and being covered can only fade it further.
# obscured_opacity = 0.25

# How covered a window must be, 0.0-1.0, before it counts as obscured. The 0.9
# default means a window peeking out by a few pixels behind a maximized
# neighbour still fades.
# obscured_threshold = 0.9

# Backdrop for translucent windows: what shows through a window at less than
# full opacity. By default that is the raw wallpaper -- which, composited in
# absolute linear light, means a window catches whatever nits the wallpaper
# happens to peak at. An HDR wallpaper graded well above `sdr_white_nits`
# (above) will visibly wash out a translucent window's text; these two knobs
# fix that without touching opacity itself. Both default to false, so nobody
# who hasn't opted in sees any change.
#
# active_backdrop_tonemap / inactive_backdrop_tonemap: cap the backdrop's
# highlights at this wallpaper's own `sdr_reference_nits` (see [wallpaper]
# above), the same tone-map program that already renders the HDR wallpaper
# correctly on a non-HDR output -- here aimed at just the area under one
# window instead of the whole screen.
# active_backdrop_tonemap = false
# inactive_backdrop_tonemap = false
#
# active_backdrop_blur / inactive_backdrop_blur: frost the backdrop -- sample
# a pre-blurred copy of the wallpaper instead of the sharp one, at
# `backdrop_blur_radius` below.
# active_backdrop_blur = false
# inactive_backdrop_blur = false
#
# Blur radius in logical pixels. Global, not per-rule: each distinct radius
# needs its own precomputed buffer, and a 4K 16-bit wallpaper is already ~66
# MB, so letting every rule pick its own radius would multiply that. `0`
# disables blur outright and skips the one-time decode-time cost entirely.
#
# Tuning note: the blur runs in linear light, so it raises the local mean
# wherever a specular highlight sits -- a frosted pane reads BRIGHTER than the
# sharp wallpaper immediately around it, not dimmer, because averaging in
# nits (not in gamma-encoded values) lets a bright highlight drag its
# neighbours up. `backdrop_luminance_nits` below is the knob that keeps that
# brightened result under window text luminance; pair blur with tonemap
# rather than using blur alone on a bright HDR wallpaper.
# backdrop_blur_radius = 32

# How bright the wallpaper is allowed to look THROUGH a translucent window.
# Turn it DOWN to make text easier to read, UP to let more of the wallpaper
# show through. Used by *_backdrop_tonemap; defaults to sdr_white_nits.
#
# WATCH OUT: this does nothing at all if you set it above your wallpaper's
# actual peak brightness -- there is then nothing left to pull down, and
# toggling tonemap looks broken rather than subtle. Useful values sit well
# BELOW sdr_white_nits; 40 is a good starting point. Range [10, 10000].
# Takes effect on save. Details: docs/brightness-tuning.md
# backdrop_luminance_nits = 40.0

# Per-window rules, applied in file order over the defaults above.
#
# `app_id` and `title` are case-insensitive SUBSTRING matches. When both are
# given both must match; a rule with neither matches every window, which makes a
# useful catch-all. Matching is on the Wayland app_id or the X11 WM_CLASS.
#
# Rules ACCUMULATE rather than the first match winning, and each rule changes
# only the fields it names. So a broad rule followed by a narrow exception works
# the obvious way: dim everything, then pin one class or title back.
#
# [[decoration.rule]]
# app_id = "signal"
# active_color = "#f38ba8"
# active_luminance_nits = 600.0
#
# Exempt video from a global dim, by title:
#
# [[decoration.rule]]
# title = "youtube"
# active_opacity = 1.0
# inactive_opacity = 1.0
#
# [[decoration.rule]]
# app_id = "alacritty"
# active_color = "#89b4fa"
# inactive_color = "#45475a"
# active_opacity = 0.95
# inactive_opacity = 0.85
#
# A translucent terminal over an HDR wallpaper: frosted and capped at
# sdr_reference_nits rather than showing raw wallpaper nits through the text.
#
# [[decoration.rule]]
# app_id = "obsidian"
# active_opacity = 0.92
# inactive_opacity = 0.85
# active_backdrop_tonemap = true
# inactive_backdrop_tonemap = true
# active_backdrop_blur = true
# inactive_backdrop_blur = true
