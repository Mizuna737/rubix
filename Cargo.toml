[package]
name = "rubix"
version = "0.1.0"
edition = "2024"
description = "A Wayland compositor with a Rubik's-cube spatial model"
license = "MIT"

[dependencies]
async-channel = "2"
async-io = "2"
async-process = "2"
futures-lite = "2"
bitflags = "2"
calloop-notify = "0.2"
pipewire = { version = "0.10", features = ["v0_3_65"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
# default-features off drops the `display-info` (EDID name-parsing) feature: its
# libdisplay-info-sys pins `< 0.3.0` but the system ships 0.3.0. We only need the
# always-available `drm_scanner` (CRTC/connector scanning); monitor names fall
# back to the connector id (e.g. "DP-1"), which is fine for first-light.
smithay-drm-extras = { version = "0.1", default-features = false }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
zbus = "5"

# HDR Phase 1a: pin the dividebysandwich/smithay fork, which adds connector
# color-state support (Colorspace/HDR metadata/max_bpc commit) not yet upstream.
# smithay and smithay-drm-extras are one workspace in the fork and must move
# together. The fork still reports version 0.7.0, so this patch is accepted
# against the "0.7"/"0.1" version requirements above.
[patch.crates-io]
smithay = { git = "https://github.com/dividebysandwich/smithay", rev = "57c805c8e6d0b34601b07d89053b376905008d8a" }
smithay-drm-extras = { git = "https://github.com/dividebysandwich/smithay", rev = "57c805c8e6d0b34601b07d89053b376905008d8a" }
