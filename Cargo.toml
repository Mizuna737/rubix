[package]
name = "rubix"
version = "0.1.0"
edition = "2024"
description = "A Wayland compositor with a Rubik's-cube spatial model"
license = "MIT"

[dependencies]
async-channel = "2"
async-io = "2"
async-process = "2"
futures-lite = "2"
# Wallpaper decode (src/wallpaper.rs). libavif is what reads the CICP block that
# says whether an image is PQ -- the `image` crate does not expose it, and that
# one field is the whole reason an HDR wallpaper can be tagged correctly.
# default-features off then codec-dav1d: the default build vendors libavif with
# *no* AV1 decoder compiled in, which parses a file and then fails to decode it.
libavif-sys = { version = "0.17", default-features = false, features = ["codec-dav1d"] }
# SDR formats only -- an HDR image always arrives as AVIF. Trimmed to the two
# formats worth supporting rather than pulling in every decoder image ships.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bitflags = "2"
calloop-notify = "0.2"
pipewire = { version = "0.10", features = ["v0_3_65"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
# default-features off drops the `display-info` (EDID name-parsing) feature: its
# libdisplay-info-sys pins `< 0.3.0` but the system ships 0.3.0. We only need the
# always-available `drm_scanner` (CRTC/connector scanning); monitor names fall
# back to the connector id (e.g. "DP-1"), which is fine for first-light.
smithay-drm-extras = { version = "0.1", default-features = false }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
zbus = "5"

# Rubix pins a fork of Smithay. Two deltas, in order:
#
#   Smithay/smithay  ->  dividebysandwich/smithay  ->  Mizuna737/smithay (rubix-patches)
#
# 1. dividebysandwich/smithay adds connector color-state support (Colorspace, HDR
#    metadata, max_bpc) plus the color-management protocol work, none of it upstream.
#    This is what makes Rubix's HDR path possible at all. (HDR Phase 1a)
# 2. `rubix-patches` adds one 17-line commit on top: `MultiFrame::render_frame_mut`,
#    exposing the inner backend frame so a render element can set a per-element shader
#    program on the udev path (see decoration.rs). Upstream keeps that field private
#    with no accessor, which makes rounded corners unimplementable on the multi-GPU
#    renderer. (HDR Phase 5d)
#
# smithay and smithay-drm-extras are one workspace in the fork and must move together;
# both entries point at the same repo and rev. The fork still reports version 0.7.0, so
# this patch is accepted against the "0.7"/"0.1" version requirements above.
#
# The pin is a fixed rev, bumped deliberately -- not tracked. Do not switch this to a
# branch: a branch moves under anyone who cloned earlier, which defeats the point.
[patch.crates-io]
smithay = { git = "https://github.com/Mizuna737/smithay.git", rev = "f2cada559a91050ba1095c30e1d5f46af1eda397" }
smithay-drm-extras = { git = "https://github.com/Mizuna737/smithay.git", rev = "f2cada559a91050ba1095c30e1d5f46af1eda397" }
