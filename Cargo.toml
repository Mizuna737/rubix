[package]
name = "rubix"
version = "0.1.0"
edition = "2024"
description = "A Wayland compositor with a Rubik's-cube spatial model"
license = "MIT"

[dependencies]
bitflags = "2"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_egl", "renderer_gl", "wayland_frontend", "desktop"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
